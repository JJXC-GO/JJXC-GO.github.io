<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中级会计师学习网</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">📚 中级会计学习网</div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">首页</a></li>
                <li><a href="chapters.html">学习区</a></li>
                <li><a href="questions.html">题库区</a></li>
                <li><a href="plan.html">学习计划</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>欢迎回来！👋</h1>
            <p>今日学习进度一览，继续加油！</p>
        </div>

        <!-- 总体统计卡片 -->
        <div class="plan-grid">
            <div class="plan-card">
                <h3>📖 学习进度</h3>
                <div style="font-size: 36px; font-weight: 700; color: var(--primary); margin: 12px 0;">
                    <span id="chapterProgress">0</span>%
                </div>
                <p style="color: var(--text-light); font-size: 14px;">已完成章节</p>
            </div>
            <div class="plan-card">
                <h3>✏️ 做题统计</h3>
                <div style="font-size: 36px; font-weight: 700; color: var(--success); margin: 12px 0;">
                    <span id="questionCount">0</span>
                </div>
                <p style="color: var(--text-light); font-size: 14px;">已做题目数</p>
            </div>
            <div class="plan-card">
                <h3>❌ 错题集</h3>
                <div style="font-size: 36px; font-weight: 700; color: var(--danger); margin: 12px 0;">
                    <span id="wrongCount">0</span>
                </div>
                <p style="color: var(--text-light); font-size: 14px;">待复习错题</p>
            </div>
            <div class="plan-card">
                <h3>📅 今日计划</h3>
                <div style="font-size: 36px; font-weight: 700; color: var(--warning); margin: 12px 0;">
                    <span id="todayProgress">0</span>/<span id="todayTotal">0</span>
                </div>
                <p style="color: var(--text-light); font-size: 14px;">今日任务完成</p>
            </div>
        </div>

        <!-- 快速入口 -->
        <div class="card">
            <div class="card-title">🚀 快速开始</div>
            <div class="chapter-tree">
                <div class="chapter-item" onclick="location.href='chapters.html'">
                    <div class="chapter-icon">📖</div>
                    <div class="chapter-info">
                        <h3>进入学习区</h3>
                        <p>按章节查看教材内容</p>
                    </div>
                </div>
                <div class="chapter-item" onclick="location.href='questions.html'">
                    <div class="chapter-icon" style="background: linear-gradient(135deg, #fecaca, #fca5a5);">✏️</div>
                    <div class="chapter-info">
                        <h3>开始做题</h3>
                        <p>章节练习与错题复习</p>
                    </div>
                </div>
                <div class="chapter-item" onclick="location.href='plan.html'">
                    <div class="chapter-icon" style="background: linear-gradient(135deg, #fde68a, #fbbf24);">📅</div>
                    <div class="chapter-info">
                        <h3>学习计划</h3>
                        <p>制定今日学习目标</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 最近错题提醒 -->
        <div class="card" id="wrongBookReminder" style="display: none;">
            <div class="card-title">⚠️ 错题提醒</div>
            <p style="color: var(--text-light); margin-bottom: 12px;">你有 <strong id="reminderCount" style="color: var(--danger);">0</strong> 道错题需要复习，建议优先巩固！</p>
            <a href="questions.html?mode=wrong" class="btn btn-danger">去复习错题</a>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        // 更新首页统计数据
        function updateStats() {
            // 章节进度（从localStorage读取）
            const readChapters = Storage.getArray('read_chapters');
            const totalChapters = 26; // 三科总章节数（示例）
            document.getElementById('chapterProgress').textContent = 
                Math.round((readChapters.length / totalChapters) * 100);

            // 做题数
            const answered = Storage.getArray('answered_questions');
            document.getElementById('questionCount').textContent = answered.length;

            // 错题数
            const wrongs = WrongBook.getAll();
            document.getElementById('wrongCount').textContent = wrongs.length;

            // 今日计划
            const today = StudyPlan.getToday();
            const plan = StudyPlan.getPlan();
            const todayPlan = plan.filter(p => p.date === today);
            const completed = todayPlan.filter(p => p.completed).length;
            document.getElementById('todayProgress').textContent = completed;
            document.getElementById('todayTotal').textContent = todayPlan.length;

            // 错题提醒
            if (wrongs.length > 0) {
                document.getElementById('wrongBookReminder').style.display = 'block';
                document.getElementById('reminderCount').textContent = wrongs.length;
            }
        }

        updateStats();
    </script>
</body>
</html>
