<h2>第一章 总论</h2>

<h3>一、财务管理目标</h3>
<p>财务管理目标主要有以下几种观点：</p>

<ul>
    <li><strong>利润最大化</strong>：以利润作为衡量企业经营成果的主要指标。</li>
    <li><strong>股东财富最大化</strong>：以股东财富的增加作为财务管理的目标。</li>
    <li><strong>企业价值最大化</strong>：以企业价值的增加作为财务管理的目标。</li>
    <li><strong>相关者利益最大化</strong>：追求与企业利益相关的各方利益最大化。</li>
</ul>

<h3>二、财务管理环节</h3>
<ol>
    <li>计划与预算</li>
    <li>决策与控制</li>
    <li>分析与考核</li>
</ol>

<h3>三、财务管理体制</h3>
<p>财务管理体制的一般模式包括：</p>
<table>
    <tr>
        <th>模式</th>
        <th>特点</th>
    </tr>
    <tr>
        <td>集权型</td>
        <td>财务管理决策权集中于总部</td>
    </tr>
    <tr>
        <td>分权型</td>
        <td>各所属单位分散行使决策权</td>
    </tr>
    <tr>
        <td>集权与分权相结合型</td>
        <td>重大决策权集中，日常经营决策权分散</td>
    </tr>
</table>
